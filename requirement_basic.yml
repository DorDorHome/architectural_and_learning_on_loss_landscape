name: loss_landscape_basic
channels:
  - conda-forge
  - defaults
dependencies:
  # Base Python and core scientific stack
  - python=3.10
  - pip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - pillow
  - tqdm
  - psutil
  # Build/tooling and Box2D bindings from conda to avoid pip build
  - swig
  - pybox2d
  # PyTorch from Conda (CPU/GPU resolved by Conda)
  - pytorch
  - torchvision
  - statsmodels
  - scikit-learn
  # Anything not conveniently available via Conda goes under pip
  - pip:
      - stable-baselines3[extra]
      - gym
      - gymnasium
      - hydra-core==1.3.2
      - omegaconf
      - pyyaml
      - wandb
      - pytest==8.3.4
