type: 'srr_aso_cbp'
network_class: ${net.network_class}  # Use the network class from the net configuration
# as BaseLearnerConfig
device: ${device}
opt: 'sgd'
init: 'kaiming'
loss: ${loss_functions.${task_shift_mode}}
step_size: 0.01 # 0.01 for SGD, 0.001 for Adam
beta_1: 0.95
beta_2: 0.999
weight_decay: 0 # L2 regularization strength , use 0.001 for labelled regression tasks
to_perturb: false
perturb_scale: 0.05
momentum: 0.9
log_rank_metrics_every: 1

# as ContinuousBackpropConfig (GnT-side maturity threshold is independent of aso_maturity_threshold below)
neurons_replacement_rate: 0.001
decay_rate_utility_track: 0.9
maturity_threshold: 100
util_type: 'adaptable_contribution'
accumulate: False
outgoing_random: False

# Soft-orthogonality regularization (ASO)
SO_reg_lambda: 0.02
age_decay_rate: 0.99
normalization_mode: "naive mse sum correction"  # "no correction" | "correct by input size" | "naive mse sum correction"
aso_maturity_threshold: 100  # required for ASO; defines young vs mature for the regularizer
include_bias_in_A_reg: false  # spec default: A = W H (no bias)

# Gradient clipping options
use_grad_clip: true
grad_clip_max_norm: 1.0
