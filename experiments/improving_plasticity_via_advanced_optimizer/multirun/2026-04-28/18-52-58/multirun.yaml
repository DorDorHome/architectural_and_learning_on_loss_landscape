hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - wandb.project=srr_cbp_hyperparameter_tuning
  job:
    name: train_with_improved_optimizer
    chdir: null
    override_dirname: wandb.project=srr_cbp_hyperparameter_tuning
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /hdda/models/my_own_models/architectural_and_learning_on_loss_landscape/experiments/improving_plasticity_via_advanced_optimizer
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /hdda/models/my_own_models/architectural_and_learning_on_loss_landscape/experiments/improving_plasticity_via_advanced_optimizer/cfg
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      learner: srr_cbp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
runs: 1
run_id: 0
seed: None
debug_mode: false
device: cuda:1
enable_cuda1_workarounds: false
epochs: 50
batch_size: 8192
num_tasks: 500
num_workers: 8
use_wandb: true
use_json: false
wandb:
  project: srr_cbp_hyperparameter_tuning
  entity: ''
  notes: Experiment with advanced optimizers.
task_shift_mode: continuous_input_deformation
task_shift_param:
  drifting_values:
    drift_std_dev: 0.05
    repulsion_strength: 0.05
    min_gap: 0.2
    value_bounds:
      lower_bound: -20.0
      upper_bound: 20.0
  continuous_input_deformation:
    drift_mode: random_walk
    linear:
      max_drift: 0.5
    random_walk:
      drift_std_dev: 0.1
    sinusoidal:
      amplitude: 0.5
      frequency: 0.05
track_rank_drop: true
from_theoretical_max_first_feature_rank: true
rank_drop_mode: ratio
track_rank: true
track_rank_batch: use_specified
specified_batch_size: 1000
rank_measure_freq_to_epoch: 10
use_pytorch_entropy_for_effective_rank: true
prop_for_approx_or_l1_rank: 0.99
numerical_rank_epsilon: 0.01
track_dead_units: true
threshold_for_non_saturating_act: 0.01
track_actual_rank: false
track_weight_magnitude: true
layers_identifier: None
data:
  dataset: MNIST
  use_torchvision: true
  data_path: /home/sfchan/dataset
  num_classes: 10
net:
  type: ConvNet_conv_and_FC_layer_norm
  network_class: conv
  device: ${device}
  netparams:
    pretrained: false
    num_classes: ${data.num_classes}
    initialization: kaiming
    input_height: None
    input_width: None
    conv_layer_bias: true
    linear_layer_bias: true
    activation: leaky_relu
    norm_param:
      layer_norm:
        eps: 1.0e-05
        elementwise_affine: false
    weight_correction_scale: 1.0
    fan_in_correction: false
    SVD_only_stride_1: false
    allow_svd_values_negative: true
    num_hidden_layers: 1
loss_functions:
  continuous_input_deformation: cross_entropy
  drifting_values: mse
evaluation:
  use_testset: false
  eval_freq_epoch: 1
  eval_metrics:
  - accuracy
  - loss
learner:
  type: srr_cbp
  network_class: ${net.network_class}
  device: ${device}
  opt: sgd
  init: kaiming
  loss: ${loss_functions.${task_shift_mode}}
  step_size: 0.01
  beta_1: 0.95
  beta_2: 0.999
  weight_decay: 0
  to_perturb: false
  perturb_scale: 0.05
  momentum: 0.9
  log_rank_metrics_every: 1
  neurons_replacement_rate: 0.001
  decay_rate_utility_track: 0.9
  maturity_threshold: 100
  util_type: adaptable_contribution
  accumulate: false
  outgoing_random: false
  SO_reg_lambda: 0.02
  aso_age_decay_rate: 0.99
  aso_normalization_mode: naive mse sum correction
  use_grad_clip: true
  grad_clip_max_norm: 1.0
